
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Car Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="container">
        <header>
            <h1>Book a Car</h1>
        </header>
        <main>
            <section id="form">
                <h2>Contact Us</h2>
                <form action="process.html" method="get" id="booking">
                    <div class="form-row">
                        <label for="contactname">Name</label>
                        <input
                            type="text"
                            name="contactname"
                            id="contactname"
                            required
                            autofocus
                            pattern="[A-Z][a-z]+( [A-Z][a-z]+)*"
                            title="Enter a valid name. Each name must start with a capital letter followed by lowercase letters."
                        >
                    </div>
                    <div class="form-row">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            name="email"
                            id="email"
                            required
                            title="Please enter a valid email address, e.g. name@example.com."
                        >
                    </div>
                    <p>Do you have a driver's licence?</p>
                    <div class="check">
                        <label>
                            <input
                                type="radio"
                                name="licence"
                                value="Yes"
                            >
                            Yes
                        </label>
                        <label>
                            <input
                                type="radio"
                                name="licence"
                                value="No"
                            >
                            No
                        </label>
                    </div>
                    <div class="form-row">
                        <label for="age">Age</label>
                        <input
                            type="number"
                            name="age"
                            id="age"
                            min="17"
                            max="80"
                            required
                            title="Please enter an age between 17 and 80."
                        >
                    </div>
                    <div class="form-row">
                        <label for="date">Event Date</label>

                        <input
                            type="date"
                            name="date"
                            id="date"
                            required
                            title="Please select an event date."
                        >
                    </div>
                    <div class="form-row">
                        <label for="car">Select a Car</label>
                        <select name="car" id="car">
                            <option value="Ford Focus">
                                Ford Focus
                            </option>
                            <option value="Hyundai Tucson">
                                Hyundai Tucson
                            </option>
                            <option value="Toyota Rav4">
                                Toyota Rav4
                            </option>
                            <option value="Renault Kadjar">
                                Renault Kadjar
                            </option>
                            <option value="Nissan Qashqai">
                                Nissan Qashqai
                            </option>
                        </select>
                    </div>
                    <p>
                        Please provide any other details you think we should know:
                    </p>
                    <textarea
                        name="details"
                        id="details"
                        rows="5"
                        cols="40"
                    ></textarea>
                    <div>
                        <button type="submit">Submit</button>

                        <button type="reset">Reset</button>
                    </div>
                </form>
            </section>
            <section id="image">
                <figure>
                    <img
                        src="images/car.jfif"
                        alt="Car"
                        class="ui fluid image"
                    >

                    <figcaption>Car Rental</figcaption>
                </figure>
            </section>
        </main>
    </div>
</body>
</html>
